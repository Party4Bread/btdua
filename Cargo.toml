[package]
name = "btdua"
version = "0.1.0"
edition = "2024"
description = "Sampling disk usage analyzer for btrfs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
parking_lot = "0.12"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }

[profile.release]
lto = true
