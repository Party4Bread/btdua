name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  BINARY_NAME: btdua

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          cargo_version="v$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          if [ "$cargo_version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation toolchain
        if: startsWith(matrix.target, 'aarch64-')
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          binary="target/${{ matrix.target }}/release/${BINARY_NAME}"
          strip "$binary" 2>/dev/null || true
          archive="${BINARY_NAME}-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "$(dirname "$binary")" "${BINARY_NAME}"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
